<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل - نظام إدارة المدرسة</title>
    <link rel="stylesheet" href="/css/main.css">

</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-small"><img src="/assist/logo.jpg" alt="Logo"></div>
                <h3 class="sidebar-title">نظام المدرسة</h3>
            </div>

            <div class="user-info">
                <div class="user-avatar">
                    <span id="userInitials">--</span>
                </div>
                <div class="user-details">
                    <h4 id="userName">--</h4>
                    <p id="userRole">--</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Nav items filled by common.js -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="dashboard-header">
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h1 class="page-title">الرسائل</h1>
                <div class="header-actions">
                    <div class="notification-container">
                        <button class="notification-btn" id="notificationBtn">
                            <span class="notification-icon">🔔</span>
                            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
                        </button>
                        <div class="notification-dropdown" id="notificationDropdown">
                            <div class="dropdown-header">
                                <span>التنبيهات</span>
                                <button id="markReadBtn">تحديد كالمقروء</button>
                            </div>
                            <div class="notification-list" id="notificationList">
                                <p class="empty-msg">لا توجد تنبيهات جديدة</p>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Messages Interface -->
            <div class="messages-container">
                <!-- Message Sidebar (List) -->
                <div class="messages-sidebar">
                    <div class="messages-header">
                        <h3 style="margin:0; font-size:1.1rem;">صندوق الوارد</h3>
                        <button id="composeBtn" class="btn btn-sm btn-primary">
                            <span>+</span> رسالة جديدة
                        </button>
                    </div>
                    <div class="messages-list-container" id="messagesListContainer">
                        <!-- Messages loaded here -->
                        <div style="padding: 2rem; text-align: center; color: var(--gray-500);">
                            جاري التحميل...
                        </div>
                    </div>
                </div>

                <!-- Message Content -->
                <div class="message-content-area" id="messageContentArea">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-state-icon">📩</div>
                        <h3>اختر رسالة للقراءة</h3>
                        <p>اضغط على أي رسالة من القائمة لعرض تفاصيلها</p>
                    </div>

                    <div class="view-message" id="viewMessage">
                        <div class="vm-header">
                            <div style="display:flex; align-items:center;">
                                <button class="back-btn" id="backToList" style="display:none;">➜</button>
                                <h2 class="vm-subject" id="msgSubject">--</h2>
                            </div>
                            <div class="vm-meta">
                                <div class="vm-sender-info">
                                    <div class="sender-avatar" id="msgSenderAvatar"></div>
                                    <div class="sender-details">
                                        <h4 id="msgSenderName">--</h4>
                                        <span id="msgDate">--</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="vm-body" id="msgBody">
                            --
                        </div>
                        <div class="vm-footer">
                            <button class="btn btn-outline-secondary" id="replyBtn">رد</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Compose Modal (Reused structure) -->
    <div class="modal-overlay" id="sendMessageModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">إرسال رسالة جديدة</h3>
                <button class="modal-close" onclick="closeModal('sendMessageModal')">×</button>
            </div>
            <form id="sendMessageForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label required">المستلم</label>
                        <select name="receiver_id" id="msgReceiverSelect" class="form-control" required>
                            <option value="">جاري التحميل...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label required">الموضوع</label>
                        <input type="text" name="subject" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label required">نص الرسالة</label>
                        <textarea name="message_text" class="form-control" rows="6" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary"
                        onclick="closeModal('sendMessageModal')">إلغاء</button>
                    <button type="submit" class="btn btn-primary">إرسال</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/messages.js"></script>
</body>

</html>
