<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- الخلفية -->
  <defs>
    <linearGradient id="mixedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F47920;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F47920;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D96810;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2898;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- التموجات في الخلفية -->
  <path d="M 0,80 Q 100,70 200,80 T 400,80 L 400,120 L 0,120 Z" fill="url(#blueGradient)" opacity="0.1"/>
  <path d="M 0,90 Q 100,85 200,90 T 400,90 L 400,120 L 0,120 Z" fill="url(#blueGradient)" opacity="0.15"/>
  
  <!-- قبعات التخرج (3 طلاب) -->
  <!-- الطالب الأيسر - أزرق -->
  <g transform="translate(60, 45)">
    <polygon points="15,10 30,5 45,10 40,15 20,15" fill="#0B1171"/>
    <circle cx="30" cy="25" r="12" fill="#0B1171"/>
    <rect x="22" y="35" width="16" height="25" rx="3" fill="#0B1171"/>
  </g>
  
  <!-- الطالب الأوسط - برتقالي (المميز) -->
  <g transform="translate(170, 35)">
    <polygon points="20,10 40,3 60,10 54,17 26,17" fill="#000000"/>
    <circle cx="40" cy="30" r="15" fill="url(#orangeGradient)"/>
    <rect x="30" y="42" width="20" height="32" rx="4" fill="url(#orangeGradient)"/>
    <!-- شرابة القبعة -->
    <line x1="40" y1="3" x2="40" y2="0" stroke="#F47920" stroke-width="2"/>
    <circle cx="40" cy="0" r="3" fill="#F47920"/>
  </g>
  
  <!-- الطالب الأيمن - أزرق -->
  <g transform="translate(280, 45)">
    <polygon points="15,10 30,5 45,10 40,15 20,15" fill="#0B1171"/>
    <circle cx="30" cy="25" r="12" fill="#0B1171"/>
    <rect x="22" y="35" width="16" height="25" rx="3" fill="#0B1171"/>
  </g>
  
  <!-- النص -->
  <text x="200" y="105" font-family="'Cairo', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="url(#mixedGradient)">
    منصة التواصل والعلوم الإلكترونية
  </text>
</svg>
